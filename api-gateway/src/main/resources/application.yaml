server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: https://auth-service-tzq7.onrender.com
          predicates:
            - Path=/auth/**

        - id: property-service
          uri: lb://property-service
          predicates:
            - Path=/properties/**

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/bookings/**

        - id: payment-route
          uri: lb://booking-service
          predicates:
            - Path=/payments/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info

